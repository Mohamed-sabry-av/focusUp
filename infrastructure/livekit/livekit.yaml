port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
keys:
  devkey: secret12345678901234567890123456789012
logging:
  level: info
room:
  auto_create: true
  empty_timeout: 300
  max_participants: 10
turn:
  enabled: false
  udp_port: 3478
  tls_port: 5349

# Join/leave events go to the API (signature-verified there). This is the only source of presence.
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:3000/api/v1/webhooks/livekit
